spring:
  ai:
    azure:
      openai:
        endpoint: https://test-openai.example.com
        api-key: test-key
  datasource:
    url: jdbc:h2:mem:indexing-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

azure:
  indexing:
    storage:
      connection-string: UseDevelopmentStorage=true
      container-name: test-container
