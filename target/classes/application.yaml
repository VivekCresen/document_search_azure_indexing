server:
  port: 8086

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./document_search_azure_indexing/.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: DOCUMENT-SEARCH-AZURE-INDEXING

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: none
      audio:
        transcription: none
        speech: none
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT:}
        api-key: ${AZURE_OPENAI_KEY:}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}
        embedding:
          options:
            deployment-name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/leave_management_system}
    username: ${DATABASE_USERNAME:${DB_USER:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${INDEXING_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${INDEXING_DB_MIN_IDLE:2}
      connection-timeout: 30000
      pool-name: AzureIndexingHikariPool

  jpa:
    hibernate:
      ddl-auto: ${INDEXING_JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  cache:
    type: caffeine
    caffeine:
      spec: ${INDEXING_CACHE_SPEC:maximumSize=2000,expireAfterWrite=15m}

azure:
  indexing:
    search:
      endpoint: ${AZURE_SEARCH_ENDPOINT:}
      api-key: ${AZURE_SEARCH_ADMIN_KEY:${AZURE_SEARCH_KEY:}}
      index-name: ${AZURE_SEARCH_INDEX_NAME:document-index}
      api-version: ${AZURE_SEARCH_API_VERSION:2023-11-01}
    storage:
      account-name: ${AZURE_STORAGE_ACCOUNT_NAME:}
      account-key: ${AZURE_STORAGE_ACCOUNT_KEY:}
      account-url: ${AZURE_STORAGE_ACCOUNT_URL:}
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      container-name: ${AZURE_STORAGE_CONTAINER_NAME:}
      directory: ${INDEXING_DIRECTORY:}
    open-ai:
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      api-key: ${AZURE_OPENAI_KEY:}
      embedding-deployment: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
      chat-deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-02-01}
    document-intelligence:
      endpoint: ${AZURE_DI_ENDPOINT:}
      api-key: ${AZURE_DI_KEY:}
      api-version: ${AZURE_DI_API_VERSION:2024-02-29-preview}
    settings:
      chunk-size: ${CHUNK_SIZE:1500}
      chunk-overlap: ${CHUNK_OVERLAP:200}
      batch-size: ${BATCH_SIZE:100}
      max-retries: ${MAX_RETRIES:3}
      blob-scan-enabled: ${INDEXING_BLOB_SCAN_ENABLED:false}
      blob-scan-fixed-delay-ms: ${INDEXING_BLOB_SCAN_FIXED_DELAY_MS:60000}
      supported-extensions:
        - .pdf
        - .docx
        - .txt

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cresensolutions: INFO
    com.azure: WARN
